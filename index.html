<style>
:root{--blue:#1165F6;--cyan:#25C7D9;--violet:#5A41FF;--navy:#1F2F98;--deep:#00215B;--bg:#F3F5F9;--surface:#fff;--ink:#00215B;--ink2:#3A4766;--muted:#67728C;--line:#D9DFEA;--crit:#B42318;--crit-bg:#FDE3E1}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#071027;--surface:#0E1A3A;--ink:#EAF0FF;--ink2:#C3CDE6;--muted:#93A0BF;--line:#24356B;--crit:#FF8A80;--crit-bg:#3F1616}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Proxima Nova",Montserrat,system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:24px 16px;
  background-image:radial-gradient(circle at 12% 10%,rgba(37,199,217,.16),transparent 40%),radial-gradient(circle at 90% 90%,rgba(90,65,255,.14),transparent 45%)}
.box{width:100%;max-width:400px;background:var(--surface);border-radius:22px;box-shadow:0 18px 50px rgba(0,33,91,.16);padding:30px 28px 26px}
.brand{display:flex;align-items:center;gap:10px 12px;flex-wrap:wrap;margin-bottom:22px}
.brand svg{flex:none}
.wm{display:flex;flex-direction:column;line-height:1;color:var(--blue)}
.wm b{font-weight:700;font-size:26px;letter-spacing:-.3px}
.wm small{font-size:8.4px;letter-spacing:6px;font-weight:600;margin-top:4px}
.sep{width:1px;height:34px;background:var(--line)}
.area{font-weight:600;color:var(--blue);font-size:18px}
h1{font-size:20px;margin:0 0 4px;font-weight:700}
p.sub{margin:0 0 20px;color:var(--muted);font-size:13.5px;line-height:1.45}
label{display:block;font-size:12.5px;font-weight:600;color:var(--ink2);margin:0 0 6px}
input{width:100%;font:inherit;font-size:15px;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:14px;outline:none}
input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(17,101,246,.18)}
button{width:100%;font:inherit;font-weight:700;font-size:15px;color:#fff;border:0;border-radius:999px;padding:12px 16px;cursor:pointer;background:linear-gradient(90deg,#25C7D9,#1165F6 55%,#5A41FF);margin-top:4px}
button:disabled{opacity:.65;cursor:wait}
button:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
.err{display:none;background:var(--crit-bg);color:var(--crit);font-size:13px;font-weight:600;border-radius:10px;padding:9px 12px;margin-bottom:14px}
.err.on{display:block}
.foot{margin-top:18px;font-size:11.5px;color:var(--muted);line-height:1.45;text-align:center}
</style>
</head>

  const enc = new TextEncoder();
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const hex = buf => Array.from(new Uint8Array(buf), b => b.toString(16).padStart(2,'0')).join('');
  const sha = async x => hex(await crypto.subtle.digest('SHA-256', typeof x === 'string' ? enc.encode(x) : x));
  const err = document.getElementById('err'), go = document.getElementById('go');
  const show = m => { err.textContent = m; err.classList.add('on'); };
  async function openWith(k){
    if(await sha(k) !== V.kh) throw new Error('clave');
    const key = await crypto.subtle.importKey('raw', k, 'AES-CBC', false, ['decrypt']);
    const gz = await crypto.subtle.decrypt({name:'AES-CBC', iv:b64(V.iv)}, key, b64(V.data));
    const html = await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    document.open(); document.write(html); document.close();
  }
  async function login(u, p){
    const e = V.users[await sha('emtech:' + u.trim().toLowerCase())];
    if(!e) throw new Error('usuario');
    const base = await crypto.subtle.importKey('raw', enc.encode(p), 'PBKDF2', false, ['deriveKey']);
    const wk = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(e.s), iterations:V.it, hash:'SHA-256'}, base, {name:'AES-CBC', length:256}, false, ['decrypt']);
    const k = new Uint8Array(await crypto.subtle.decrypt({name:'AES-CBC', iv:b64(e.iv)}, wk, b64(e.w)));
    if(await sha(k) !== V.kh) throw new Error('clave');
    try { sessionStorage.setItem('emtech-tk', btoa(String.fromCharCode(...k))); } catch(_) {}
    await openWith(k);
  }
  if(!window.crypto || !crypto.subtle || !window.DecompressionStream){ show('Tu navegador no es compatible. Abre el enlace en una versión reciente de Chrome, Edge o Safari.'); go.disabled = true; return; }
  // misma pestaña: no vuelve a pedir la contraseña al recargar
  let saved = null; try { saved = sessionStorage.getItem('emtech-tk'); } catch(_) {}
  if(saved) openWith(b64(saved)).catch(() => { try { sessionStorage.removeItem('emtech-tk'); } catch(_) {} });
  document.getElementById('f').addEventListener('submit', async ev => {
    ev.preventDefault(); err.classList.remove('on');
    const u = document.getElementById('u').value, p = document.getElementById('p').value;
    if(!u || !p){ show('Escribe tu correo y tu contraseña.'); return; }
    go.disabled = true; go.textContent = 'Abriendo…';
    try { await login(u, p); }
    catch(_) { show('Correo o contraseña incorrectos.'); go.disabled = false; go.textContent = 'Entrar'; document.getElementById('p').select(); }
  });
})();
